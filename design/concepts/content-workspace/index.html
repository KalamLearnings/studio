/* ===================================================================
   Actions
   =================================================================== */
function toast(html, undo) {
  const root = document.getElementById("toast-root");
  root.innerHTML = `<div class="toast" role="status">${html}${undo ? `<button data-act="undo">Undo <kbd>u</kbd></button>` : ""}</div>`;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => (root.innerHTML = ""), 5000);
}
function record(it, before, msg) {
  S.history.push({ key: it.key, before });
  it.mine = true;
  toast(msg, true);
}
function advance() {
  const vis = visible();
  const next = vis.find((i) => needsDecision(i) && i.key !== S.sel) || null;
  S.sel = next ? next.key : (vis[0]?.key ?? null);
  S.focus = 0; S.mode = null;
}
function snapshot(it) { return JSON.parse(JSON.stringify(it)); }

function approve() {
  const it = cur(); if (!it || !can(KINDS[it.kind].gate)) return;
  const before = snapshot(it);
  if (it.kind === "blend") {
    const t = blendTargets(it)[S.focus] || blendTargets(it)[0]; if (!t) return;
    if (t.type === "split") it.forms[t.fi].split = "approved"; else it.forms[t.fi].takes[t.ti].status = "ready";
    S.mode = null;
    if (!blendTargets(it).length) { it.state = "approved"; record(it, before, `Blend reviewed: ${ar(it.ar)}`); advance(); }
    else { S.focus = 0; record(it, before, `${t.type === "split" ? "Split" : "Take"} approved`); }
    return render();
  }
  if (it.kind === "request") { S.mode = { type: "fulfil" }; return render(); }
  if (it.kind === "phrase" && it.problems.length) return;
  if (it.kind === "recording" && it.take.status !== "needs_review") return;
  if (it.state !== "todo") return;
  it.state = "approved"; it.by = S.role.name; it.at = "just now";
  record(it, before, `${{ spelling: "Approved", reading: "Reading confirmed", draft: "Draft approved", phrase: "Approved", recording: "Take approved" }[it.kind]}: ${it.latin ? esc(it.ar) : ar(it.ar)}`);
  advance(); render();
}
function startReject() {
  const it = cur(); if (!it || !can(KINDS[it.kind].gate) || it.state !== "todo") return;
  if (it.kind === "spelling" || it.kind === "reading") return;
  if (it.kind === "phrase") return;
  if (it.kind === "blend") { const t = blendTargets(it)[S.focus]; if (!t) return; S.mode = { type: t.type === "split" ? "split-reject" : "reject" }; }
  else S.mode = { type: "reject" };
  render();
  // Reason pickers keep focus on the page so the number keys pick a reason; free-text rejections focus the note.
  const needsText = S.mode.type === "split-reject" || it.kind === "draft" || it.kind === "request";
  if (needsText) setTimeout(() => document.getElementById(S.mode.type === "split-reject" ? "splitnote" : "rnote")?.focus({ preventScroll: true }), 0);
}
function confirmReject() {
  const it = cur(); if (!it || !S.mode) return;
  const note = (document.getElementById("rnote") || document.getElementById("splitnote"))?.value.trim() ?? "";
  S.mode.note = note;
  if (S.mode.type === "split-reject" && !note) { S.mode.err = "Say why the split is wrong in the note."; return render(); }
  if ((it.kind === "recording" || it.kind === "blend") && S.mode.type === "reject") {
    if (!S.mode.reason) { S.mode.err = "Pick a reason."; return render(); }
    if (S.mode.reason === "other" && !note) { S.mode.err = "Say why in the note."; return render(); }
  }
  const before = snapshot(it);
  if (it.kind === "blend") {
    const t = blendTargets(it)[S.focus];
    if (t.type === "split") it.forms[t.fi].split = "rejected"; else it.forms[t.fi].takes[t.ti].status = "rejected";
    S.mode = null; S.focus = 0;
    if (!blendTargets(it).length) { it.state = "rejected"; advance(); }
    record(it, before, `${t.type === "split" ? "Split" : "Take"} rejected`);
    return render();
  }
  it.state = "rejected"; it.reason = note || (S.mode.reason ? PHRASE_REASONS.find((r) => r[0] === S.mode.reason)?.[1] : ""); it.by = S.role.name; it.at = "just now";
  record(it, before, `${it.kind === "request" ? "Declined" : "Rejected"}: ${it.latin ? esc(it.ar) : ar(it.ar)}`);
  advance(); render();
}
function notePseudo() {
  const it = cur(); if (!it || it.kind !== "spelling" || it.state !== "todo") return;
  const before = snapshot(it); it.state = "pseudo";
  record(it, before, `Noted as not a real word: ${ar(it.ar)}`); advance(); render();
}
function startFix() {
  const it = cur(); if (!it || it.kind !== "spelling" || it.state !== "todo") return;
  S.mode = { type: "fix", value: it.ar }; render();
  setTimeout(() => { const i = document.getElementById("fixin"); if (i) { i.focus(); i.select(); } }, 0);
}
const skel = (s) => s.replace(/[ً-ْٰـ]/g, "");
function saveFix() {
  const it = cur(); const v = document.getElementById("fixin").value.trim();
  if (!v) S.mode.err = "Type the corrected spelling.";
  else if (v === it.ar) S.mode.err = "The correction is the same as the current spelling.";
  else if (skel(v) !== skel(it.ar)) S.mode.err = "A correction only changes the harakat; the letters must stay the same.";
  else { const before = snapshot(it); it.state = "wrong"; it.fix = v; S.mode = null; record(it, before, `Noted: respell ${ar(before.ar)} as ${ar(v)}`); advance(); }
  S.mode && (S.mode.value = v);
  render();
}
function undo() {
  const h = S.history.pop(); if (!h) return;
  const i = S.items.findIndex((x) => x.key === h.key);
  S.items[i] = h.before; S.sel = h.key; S.mode = null; S.focus = 0;
  document.getElementById("toast-root").innerHTML = "";
  if (S.status === "todo" && !needsDecision(h.before)) S.status = "all";
  render();
}
function bulkApprove() {
  const vis = visible().filter((i) => S.checked.has(i.key) && bulkSafe(i));
  if (!vis.length) return;
  for (const it of vis) { S.history.push({ key: it.key, before: snapshot(it) }); it.state = "approved"; it.mine = true; it.by = S.role.name; it.at = "just now"; }
  S.checked.clear();
  toast(`Approved ${vis.length} spellings`, true);
  advance(); render();
}

let playTimer = null;
function togglePlay(id) {
  if (S.playing && S.playing.id === id) { S.playing = null; clearInterval(playTimer); return render(); }
  S.playing = { id, t: 0 }; clearInterval(playTimer);
  playTimer = setInterval(() => { if (!S.playing) return clearInterval(playTimer); S.playing.t += 0.04; if (S.playing.t >= 1) { S.playing = null; clearInterval(playTimer); } renderDetail(); }, 60);
  render();
}
function playCurrent(alt) {
  const it = cur(); if (!it) return;
  if (it.kind === "recording") { if (alt && it.served) return togglePlay(it.served.id); if (it.take.status === "needs_review") return togglePlay(it.take.id); }
  if (it.kind === "blend") { const t = blendTargets(it)[S.focus]; const tk = t && t.type === "take" ? it.forms[t.fi].takes[t.ti] : it.forms.flatMap((f) => f.takes).find((x) => x.dur); if (tk) togglePlay(tk.id); }
  if (it.kind === "letter" && it.status !== "broken") togglePlay(it.key);
}

/* ===================================================================
   Render all + events
   =================================================================== */
function render() {
  document.documentElement.style.setProperty("--demo-h", document.getElementById("demo").offsetHeight + "px");
  const c = counts();
  const gated = S.items.filter((i) => needsDecision(i) && !can(KINDS[i.kind].gate) && !(S.scenario === "partial" && i.kind === "draft")).length;
  document.getElementById("hsub").textContent = S.scenario === "loading" ? "Loading every queue..." : c.all ? `${c.all} decisions waiting${gated ? `, ${c.all - gated} yours, ${gated} for another role` : ""}` : "Nothing waits for a decision";
  document.getElementById("rolechip").textContent = S.role.label;
  document.getElementById("avatar").textContent = S.role.initials;
  renderNav(); renderRail(); renderList(); renderDetail();
  const row = document.getElementById("row-" + S.sel);
  if (row) row.scrollIntoView({ block: "nearest" });
}
function select(key) { S.sel = key; S.sub = null; S.mode = null; S.focus = 0; S.showDetailMobile = true; render(); }
function move(d) {
  if (S.lens.startsWith("lib-")) return;
  const vis = visible(); if (!vis.length) return;
  const i = vis.findIndex((x) => x.key === S.sel);
  const n = i < 0 ? 0 : Math.max(0, Math.min(vis.length - 1, i + d));
  select(vis[n].key);
}
function setLens(l) { S.lens = l; S.sub = null; S.checked.clear(); S.mode = null; if (!l.startsWith("lib-")) { const v = visible(); if (!v.find((x) => x.key === S.sel)) S.sel = v[0]?.key ?? null; } render(); }

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-lens],[data-status],[data-key],[data-check],[data-act],[data-play],[data-reason],[data-pick],[data-fulfil],[data-family],[data-concept],[data-goto]");
  if (!t) return;
  const d = t.dataset;
  if (d.check !== undefined) { e.stopPropagation(); if (t.disabled) return; S.checked.has(d.check) ? S.checked.delete(d.check) : S.checked.add(d.check); return render(); }
  if (d.lens) return setLens(d.lens);
  if (d.status) { S.status = d.status; return render(); }
  if (d.play) return togglePlay(d.play);
  if (d.reason) { S.mode.reason = d.reason; S.mode.err = null; S.mode.note = document.getElementById("rnote")?.value || ""; return render(); }
  if (d.pick) { S.mode = { type: "pick", i: +d.pick }; return render(); }
  if (d.fulfil) { const it = cur(); const before = snapshot(it); it.state = "approved"; it.fulfilled = d.fulfil; record(it, before, `Request fulfilled with ${ar(W[d.fulfil].ar)}`); advance(); return render(); }
  if (d.family) { S.sub = { type: "family", id: d.family }; S.showDetailMobile = true; return render(); }
  if (d.concept) { S.sub = { type: "concept", slug: d.concept }; S.showDetailMobile = true; return render(); }
  if (d.goto) { S.status = "all"; S.lens = "all"; return select(d.goto); }
  if (d.key) return select(d.key);
  const a = d.act;
  if (a === "approve") return approve();
  if (a === "reject") return startReject();
  if (a === "confirm-reject") return confirmReject();
  if (a === "cancel") { S.mode = null; return render(); }
  if (a === "pseudo") return notePseudo();
  if (a === "fix") return startFix();
  if (a === "save-fix") return saveFix();
  if (a === "undo") return undo();
  if (a === "bulk-approve") return bulkApprove();
  if (a === "bulk-clear") { S.checked.clear(); return render(); }
  if (a === "withdraw" || a === "clear-note" || a === "undo-read") { const it = cur(); const b = snapshot(it); it.state = "todo"; delete it.by; record(it, b, a === "withdraw" ? "Approval withdrawn" : "Cleared"); return render(); }
  if (a === "sub-back") { S.sub = null; return render(); }
  if (a === "back") { S.showDetailMobile = false; S.sub = null; return render(); }
  if (a === "clear-q") { S.q = ""; return render(); }
  if (a === "retry") { S.scenario = "normal"; document.getElementById("scenario").value = "normal"; return render(); }
  if (a === "goto-word") { S.lens = "spelling"; S.status = "all"; return select("s-bab"); }
  if (a === "join-family") { S.sub = { type: "family", id: "book" }; return render(); }
  if (a === "link-concept") { S.sub = { type: "concept", slug: "book" }; return render(); }
  if (a === "new-family" || a === "new-concept") return toast(`Opens the New ${a === "new-family" ? "family" : "concept"} dialog (same fields as today)`);
  if (a === "open-builder") return toast("Opens the activity in the builder, in a new tab");
  if (a === "export") return toast("Downloads word-review-decisions.csv (same columns as today)");
  if (a === "ai-batch") return toast("Checked the listed words: the AI flags show on each word");
  if (a === "request-draft") return toast("Pick a node and a type, then the draft appears here when the save checks pass");
  if (a === "refresh") return toast("Every source read again");
  if (a === "regen") return toast(S.scenario === "recoff" ? "Recording is switched off until the owner turns it on." : "A new take is being made. The list looks again every 5 seconds.");
});
document.addEventListener("input", (e) => {
  if (e.target.id === "q") { S.q = e.target.value; const pos = e.target.selectionStart; renderList(); renderRail(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(pos, pos); }
  if (e.target.id === "fixin") { const p = document.getElementById("fixprev"); if (p) p.innerHTML = ar(e.target.value, "unit sm"); }
});
document.addEventListener("change", (e) => {
  const id = e.target.id, v = e.target.value;
  if (id === "sort") { S.sort = v; render(); }
  if (id === "kindsel") setLens(v);
  if (id === "role") { S.role = ROLES[v]; S.mode = null; render(); }
  if (id === "scenario") {
    S.scenario = v; S.mode = null; S.items = seedItems(); S.history = [];
    if (v === "empty") S.items.forEach((i) => { if (needsDecision(i)) { i.state = "approved"; i.by = "Partner"; i.at = "today"; } });
    if (v === "recoff") { S.lens = "recording"; S.status = "all"; S.sel = "rc-hadhihi"; }
    if (v === "partial") { S.lens = "all"; S.status = "todo"; }
    if (v === "empty") { S.lens = "all"; S.status = "todo"; S.sel = null; }
    render();
  }
  if (id === "theme") document.documentElement.classList.toggle("dark", v === "dark");
  if (id === "face") document.documentElement.classList.toggle("naskh", v === "naskh");
});

const KEYMAP = [
  ["Move", [["Next item", ["j"]], ["Previous item", ["k"]], ["Next decision on this item (blend)", ["tab"]], ["Search", ["/"]], ["Select for bulk", ["x"]], ["Status: to decide, decided, all", ["t"]], ["Jump to a kind", ["1", "-", "8"]], ["Everything", ["0"]], ["Back, cancel, close", ["esc"]]]],
  ["Decide", [["Approve, confirm, fulfil", ["a"]], ["Reject, decline (opens reasons)", ["r"]], ["Pick a reason or a candidate", ["1", "-", "9"]], ["Confirm the reason", ["enter"]], ["Not a real word (spelling)", ["p"]], ["Wrong harakat (spelling)", ["h"]], ["Approve every selected", ["shift", "a"]], ["Undo the last decision", ["u"]]]],
  ["Listen and context", [["Play or pause", ["space"]], ["Play the served take to compare", ["shift", "space"]], ["Regenerate (recording)", ["g"]], ["Open the family", ["f"]], ["Open the concept", ["c"]], ["Open in the builder (draft)", ["o"]], ["This sheet", ["?"]]]],
];
function showKeys() {
  document.getElementById("overlay-root").innerHTML = `<div class="overlay" data-act="close-keys"><div class="sheet" role="dialog" aria-label="Keyboard shortcuts" onclick="event.stopPropagation()"><h2>Keyboard</h2><p class="muted" style="margin:0">Everything works with the mouse too. Keys are off while you type in a field.</p><div class="keys">${KEYMAP.map(([g, rows]) => `<h6>${g}</h6>` + rows.map(([l, ks]) => `<div><span>${l}</span><span>${ks.map((k) => k === "-" ? "to" : `<kbd>${k}</kbd>`).join(" ")}</span></div>`).join("")).join("")}</div></div></div>`;
}
document.getElementById("overlay-root").addEventListener("click", (e) => { if (e.target.closest("[data-act=close-keys]")) e.currentTarget.innerHTML = ""; });

document.addEventListener("keydown", (e) => {
  const typing = e.target.matches("input, textarea, select");
  if (e.key === "Escape") {
    if (document.getElementById("overlay-root").innerHTML) { document.getElementById("overlay-root").innerHTML = ""; return; }
    if (typing) { e.target.blur(); if (!S.mode) return; }
    if (S.mode) { S.mode = null; return render(); }
    if (S.sub) { S.sub = null; return render(); }
    if (S.showDetailMobile) { S.showDetailMobile = false; return render(); }
    return;
  }
  if (e.key === "Enter" && S.mode) {
    if (S.mode.type === "fix") { e.preventDefault(); return saveFix(); }
    if (["reject", "split-reject"].includes(S.mode.type)) { e.preventDefault(); return confirmReject(); }
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  const it = cur();
  if (S.mode && /^[0-9]$/.test(e.key)) {
    const n = e.key === "0" ? 10 : +e.key;
    if (S.mode.type === "reject" && (it.kind === "recording" || it.kind === "blend")) {
      const list = it.kind === "recording" ? PHRASE_REASONS : TAKE_REASONS;
      if (list[n - 1]) { S.mode.reason = list[n - 1][0]; S.mode.err = null; render(); if (list[n - 1][0] === "other") document.getElementById("rnote")?.focus(); }
      return;
    }
    if (S.mode.type === "fulfil") { const pool = ["kitab", "tin", "tamru"]; const k = pool[n - 1]; if (k) document.querySelector(`[data-fulfil="${k}"]`)?.click(); return; }
  }
  if (it && it.kind === "reading" && /^[1-9]$/.test(e.key) && it.candidates[+e.key - 1]) { S.mode = { type: "pick", i: +e.key - 1 }; return render(); }
  switch (e.key) {
    case "j": case "ArrowDown": e.preventDefault(); return move(1);
    case "k": case "ArrowUp": e.preventDefault(); return move(-1);
    case "/": e.preventDefault(); return document.getElementById("q")?.focus();
    case "?": return showKeys();
    case "a": return approve();
    case "A": return bulkApprove();
    case "r": return startReject();
    case "p": return notePseudo();
    case "h": return startFix();
    case "u": return undo();
    case "x": if (it && bulkSafe(it)) { S.checked.has(it.key) ? S.checked.delete(it.key) : S.checked.add(it.key); render(); } return;
    case "t": S.status = { todo: "done", done: "all", all: "todo" }[S.status]; return render();
    case " ": e.preventDefault(); return playCurrent(e.shiftKey);
    case "g": if (it && it.kind === "recording") document.querySelector("[data-act=regen]")?.click(); return;
    case "o": if (it && it.kind === "draft") toast("Opens the activity in the builder, in a new tab"); return;
    case "f": { const fid = it && (it.w ? W[it.w].family : it.family); if (fid) { S.sub = { type: "family", id: fid }; render(); } return; }
    case "c": { const fid = it && (it.w ? W[it.w].family : it.family); const slug = fid && FAMILIES[fid].concept; if (slug) { S.sub = { type: "concept", slug }; render(); } return; }
    case "Tab": if (it && it.kind === "blend" && !S.mode) { e.preventDefault(); const n = blendTargets(it).length; if (n) { S.focus = (S.focus + (e.shiftKey ? n - 1 : 1)) % n; render(); } } return;
  }
  if (/^[0-8]$/.test(e.key) && !S.mode) { const k = e.key === "0" ? "all" : KIND_ORDER[+e.key - 1]; if (k) setLens(k); }
});

window.addEventListener("resize", () => document.documentElement.style.setProperty("--demo-h", document.getElementById("demo").offsetHeight + "px"));
S.sel = visible()[0]?.key ?? null;
render();
</script>
</body>
