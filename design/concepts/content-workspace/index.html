<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Review concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Tokens: Studio app/globals.css (shadcn HSL triplets). Dark is the default here; light is Studio's :root. */
:root {
  --background: 0 0% 100%; --foreground: 220 13% 18%;
  --card: 0 0% 100%; --muted: 210 20% 96%; --muted-foreground: 215 14% 45%;
  --primary: 211 65% 57%; --primary-foreground: 0 0% 100%;
  --secondary: 160 64% 52%; --accent: 178 50% 48%;
  --destructive: 0 75% 63%; --border: 220 13% 90%; --input: 220 13% 90%; --ring: 211 65% 57%;
  --success: 140 42% 49%; --warning: 37 91% 55%; --info: 211 65% 69%;
  --sidebar-background: 210 20% 98%; --sidebar-accent: 210 20% 94%;
  --activity-assessment: 252 39% 59%; --star: 45 91% 61%;
  --env-dev: 45 93% 47%;
  --radius: 0.5rem;
  --ar-font: "Noto Sans Arabic", Arial, sans-serif;
  color-scheme: light;
}
.dark {
  --background: 222 47% 8%; --foreground: 210 40% 98%;
  --card: 222 47% 10%; --muted: 217 33% 15%; --muted-foreground: 215 20% 65%;
  --primary: 211 65% 52%; --secondary: 160 64% 45%; --accent: 178 50% 44%;
  --destructive: 0 63% 45%; --border: 217 33% 18%; --input: 217 33% 18%; --ring: 211 65% 52%;
  --success: 140 42% 42%; --warning: 37 91% 50%; --info: 211 65% 60%;
  --sidebar-background: 222 47% 7%; --sidebar-accent: 217 33% 15%;
  --activity-assessment: 252 39% 55%; --star: 45 91% 55%;
  color-scheme: dark;
}
.naskh { --ar-font: "Noto Naskh Arabic", "Noto Sans Arabic", serif; }

* { box-sizing: border-box; border-color: hsl(var(--border)); }
html, body { height: 100%; margin: 0; }
body {
  background: hsl(var(--background)); color: hsl(var(--foreground));
  font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 2px; }
.ar { font-family: var(--ar-font); direction: rtl; unicode-bidi: isolate; line-height: 1.9; }
.muted { color: hsl(var(--muted-foreground)); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
kbd {
  display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 4px;
  border: 1px solid hsl(var(--border)); border-bottom-width: 2px; border-radius: 4px;
  font: 600 10.5px/1 ui-monospace, Menlo, monospace; color: hsl(var(--muted-foreground)); background: hsl(var(--background));
}

/* ---------- concept controls (not part of the design) ---------- */
.demo {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 16px;
  background: repeating-linear-gradient(135deg, hsl(var(--muted)) 0 8px, hsl(var(--background)) 8px 16px);
  border-bottom: 1px dashed hsl(var(--border)); font-size: 12px;
}
.demo b { font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 10.5px; color: hsl(var(--muted-foreground)); }
.demo label { display: inline-flex; align-items: center; gap: 6px; background: hsl(var(--card)); padding: 2px 8px; border-radius: 6px; border: 1px solid hsl(var(--border)); }
.demo select { background: transparent; border: 0; font-size: 12px; padding: 2px 0; }
.demo select option { background: hsl(var(--card)); }

/* ---------- shell ---------- */
.shell { display: flex; height: calc(100vh - var(--demo-h, 37px)); }
.nav { width: 80px; flex: none; display: flex; flex-direction: column; background: hsl(var(--sidebar-background)); border-right: 1px solid hsl(var(--border)); }
.nav .logo { height: 64px; display: grid; place-items: center; border-bottom: 1px solid hsl(var(--border)); }
.nav .logo span { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, hsl(var(--primary)), hsl(var(--accent))); display: grid; place-items: center; font-weight: 700; color: #fff; }
.nav nav { display: flex; flex-direction: column; gap: 2px; padding: 12px 8px; overflow: auto; }
.nav a { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 8px; color: hsl(var(--foreground) / .7); text-decoration: none; font-size: 10px; font-weight: 500; text-align: center; position: relative; }
.nav a:hover, .nav a.on { background: hsl(var(--sidebar-accent)); color: hsl(var(--foreground)); }
.nav a svg { width: 22px; height: 22px; }
.nav a .pip { position: absolute; top: 4px; right: 10px; min-width: 16px; height: 16px; border-radius: 8px; background: hsl(var(--primary)); color: #fff; font-size: 9.5px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
.nav .gone { opacity: .35; text-decoration: line-through; pointer-events: none; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.header { height: 64px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px; border-bottom: 1px solid hsl(var(--border)); background: hsl(var(--background)); }
.header h1 { font-size: 20px; font-weight: 600; margin: 0; }
.header .sub { font-size: 12.5px; margin-left: 12px; }
.header .right { display: flex; align-items: center; gap: 10px; }
.env { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: hsl(var(--env-dev)); color: #000; letter-spacing: .04em; }
.who { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: hsl(var(--primary) / .12); color: hsl(var(--primary)); display: grid; place-items: center; font-weight: 600; font-size: 13px; }
.rolechip { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid hsl(var(--border)); color: hsl(var(--muted-foreground)); }

.ws { flex: 1; min-height: 0; display: grid; grid-template-columns: 228px minmax(340px, 400px) minmax(0, 1fr); background: hsl(var(--muted) / .3); }

/* ---------- rail ---------- */
.rail { border-right: 1px solid hsl(var(--border)); overflow: auto; padding: 14px 10px 24px; background: hsl(var(--background)); }
.rail h3 { margin: 16px 10px 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: hsl(var(--muted-foreground)); }
.rail h3:first-child { margin-top: 2px; }
.rail button { width: 100%; display: flex; align-items: center; gap: 9px; padding: 7px 10px; border: 0; background: transparent; border-radius: 7px; text-align: left; font-size: 13px; color: hsl(var(--foreground) / .85); }
.rail button:hover { background: hsl(var(--muted)); }
.rail button.on { background: hsl(var(--primary) / .14); color: hsl(var(--foreground)); box-shadow: inset 2px 0 0 hsl(var(--primary)); }
.rail .n { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 12px; color: hsl(var(--muted-foreground)); }
.rail .n.hot { color: hsl(var(--foreground)); font-weight: 600; }
.rail .key { margin-left: 6px; }
.dot { width: 8px; height: 8px; border-radius: 3px; flex: none; background: var(--c, hsl(var(--muted-foreground))); }
.rail .lock { font-size: 10px; color: hsl(var(--muted-foreground)); border: 1px solid hsl(var(--border)); border-radius: 4px; padding: 0 4px; }
.rail .foot { margin: 18px 10px 0; font-size: 11.5px; line-height: 1.5; }

/* kind colours: Studio palette (primary, secondary, accent, assessment purple, star yellow, pink) */
.k-spelling { --c: hsl(211 65% 60%); }
.k-reading  { --c: hsl(195 60% 55%); }
.k-blend    { --c: hsl(178 50% 48%); }
.k-draft    { --c: hsl(252 45% 66%); }
.k-request  { --c: hsl(282 35% 62%); }
.k-phrase   { --c: hsl(160 55% 48%); }
.k-recording{ --c: hsl(340 60% 66%); }
.k-letter   { --c: hsl(45 85% 58%); }

/* ---------- list ---------- */
.list { border-right: 1px solid hsl(var(--border)); display: flex; flex-direction: column; min-height: 0; background: hsl(var(--background)); }
.lhead { padding: 12px 12px 8px; border-bottom: 1px solid hsl(var(--border)); display: grid; gap: 8px; }
.search { position: relative; }
.search svg { position: absolute; left: 10px; top: 50%; translate: 0 -50%; width: 15px; height: 15px; color: hsl(var(--muted-foreground)); }
.search input { width: 100%; height: 36px; padding: 0 34px 0 32px; border-radius: 7px; border: 1px solid hsl(var(--input)); background: hsl(var(--background)); }
.search kbd { position: absolute; right: 8px; top: 50%; translate: 0 -50%; }
.lrow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-width: 0; }
.lrow .sel { min-width: 0; }
.list { min-width: 0; overflow: hidden; }
.lmeta { flex-wrap: wrap; gap: 4px; }
.seg { display: inline-flex; border: 1px solid hsl(var(--border)); border-radius: 7px; padding: 2px; gap: 2px; }
.seg button { white-space: nowrap; border: 0; background: transparent; padding: 3px 9px; border-radius: 5px; font-size: 12px; color: hsl(var(--muted-foreground)); }
.seg button.on { background: hsl(var(--muted)); color: hsl(var(--foreground)); font-weight: 500; }
.sel { height: 30px; border-radius: 7px; border: 1px solid hsl(var(--border)); background: hsl(var(--background)); padding: 0 6px; font-size: 12px; }
.kindsel { display: none; }
.lmeta { display: flex; justify-content: space-between; font-size: 11.5px; color: hsl(var(--muted-foreground)); padding: 0 2px; }
.items { flex: 1; overflow: auto; }
.item { display: grid; grid-template-columns: 18px 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 12px 10px 10px; border-bottom: 1px solid hsl(var(--border) / .7); cursor: pointer; position: relative; }
.item:hover { background: hsl(var(--muted) / .5); }
.item.on { background: hsl(var(--primary) / .12); }
.item.on::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: hsl(var(--primary)); }
.item.done { opacity: .62; }
.item .cb { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid hsl(var(--muted-foreground) / .6); display: grid; place-items: center; background: transparent; padding: 0; }
.item .cb.on { background: hsl(var(--primary)); border-color: hsl(var(--primary)); }
.item .cb.on::after { content: ""; width: 7px; height: 4px; border: 2px solid #fff; border-top: 0; border-right: 0; rotate: -45deg; translate: 0 -1px; }
.item .cb[disabled] { opacity: .25; cursor: default; }
.item .ar { font-size: 23px; line-height: 1.6; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .ar.lat { font-family: inherit; direction: ltr; text-align: left; font-size: 14px; font-weight: 500; line-height: 1.5; }
.item .line2 { grid-column: 2 / 4; display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: hsl(var(--muted-foreground)); min-width: 0; }
.item .line2 .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .kindtag { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.item .top { grid-column: 2 / 4; display: flex; align-items: center; gap: 10px; justify-content: space-between; min-width: 0; }
.item .top .ar { flex: 1; min-width: 0; }

.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 600; border: 1px solid transparent; white-space: nowrap; }
.pill.todo { background: hsl(var(--warning) / .14); color: hsl(var(--warning)); }
.pill.ok { background: hsl(var(--success) / .16); color: hsl(140 45% 60%); }
.pill.no { background: hsl(var(--destructive) / .16); color: hsl(0 70% 70%); }
.pill.info { background: hsl(var(--info) / .14); color: hsl(var(--info)); }
.pill.neutral { border-color: hsl(var(--border)); color: hsl(var(--muted-foreground)); }
.pill.gate { border: 1px dashed hsl(var(--border)); color: hsl(var(--muted-foreground)); font-weight: 500; }
:root:not(.dark) .pill.ok { color: hsl(140 50% 32%); }
:root:not(.dark) .pill.no { color: hsl(0 60% 45%); }
:root:not(.dark) .pill.todo { color: hsl(30 80% 35%); }

.bulk { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: hsl(var(--primary) / .12); border-bottom: 1px solid hsl(var(--primary) / .35); font-size: 12.5px; }
.bulk .sp { flex: 1; }

/* ---------- detail ---------- */
.detail { min-width: 0; display: flex; flex-direction: column; min-height: 0; container-type: inline-size; container-name: detail; }
.dscroll { flex: 1; overflow: auto; }
.dinner { max-width: 1120px; margin: 0 auto; padding: 20px 24px 32px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
.dinner .ctx { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
@container detail (min-width: 760px) {
  .dinner:not(.single) { grid-template-columns: minmax(0, 1fr) 264px; gap: 20px; }
  .dinner:not(.single) .ctx { grid-template-columns: minmax(0, 1fr); }
}
.hero, .card { min-width: 0; }
.dinner.single { grid-template-columns: minmax(0, 1fr); max-width: 860px; }
.crumbs { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 12px; color: hsl(var(--muted-foreground)); flex-wrap: wrap; }
.crumbs button { border: 0; background: none; color: hsl(var(--primary)); padding: 0; font-size: 12px; }
.hero { background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 12px; padding: 18px 20px 16px; }
.hero .eyebrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: hsl(var(--muted-foreground)); }
.hero .eyebrow .kindtag { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; color: hsl(var(--foreground)); }
.hero .big { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 6px; }
.hero .big .ar { font-size: 54px; line-height: 1.75; font-weight: 500; }
.hero .big .ar.long { font-size: 38px; }
.hero .gloss { font-size: 14px; color: hsl(var(--muted-foreground)); }
.hero .gloss b { color: hsl(var(--foreground)); font-weight: 500; }
.say { margin-top: 10px; font-size: 13.5px; padding: 9px 12px; border-radius: 8px; background: hsl(var(--muted) / .6); }
.say.warn { background: hsl(var(--warning) / .1); border: 1px solid hsl(var(--warning) / .3); }
.say.calm { background: hsl(var(--info) / .08); border: 1px solid hsl(var(--info) / .25); }
.say.err { background: hsl(var(--destructive) / .1); border: 1px solid hsl(var(--destructive) / .35); }

.card { background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 12px; padding: 14px 16px; }
.card + .card { margin-top: 14px; }
.card h4 { margin: 0 0 10px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.card h4 .muted { font-weight: 400; font-size: 12px; }
.col { display: grid; gap: 14px; align-content: start; min-width: 0; }
.ctx .card { padding: 12px 14px; }
.ctx h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: hsl(var(--muted-foreground)); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; }
.kv dt { color: hsl(var(--muted-foreground)); }
.kv dd { margin: 0; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; max-width: 100%; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; border: 1px solid hsl(var(--border)); font-size: 12px; background: hsl(var(--background)); }
.chip .ar { font-size: 17px; line-height: 1.5; }
.chip.flag { border-color: hsl(var(--warning) / .45); color: hsl(var(--warning)); }
.chip.pass { color: hsl(140 45% 58%); }
.chip.fail { border-color: hsl(var(--destructive) / .5); color: hsl(0 70% 70%); }
.chip.note { color: hsl(var(--info)); }
:root:not(.dark) .chip.pass { color: hsl(140 50% 32%); }
.linkbtn { border: 0; background: none; color: hsl(var(--primary)); padding: 0; font-size: 12.5px; }
.linkbtn:hover { text-decoration: underline; }
.mem { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid hsl(var(--border) / .6); font-size: 12px; }
.mem:first-of-type { border-top: 0; }
.mem .ar { font-size: 22px; line-height: 1.6; }
.mem .sp { flex: 1; }
.mem.cur { background: hsl(var(--primary) / .08); margin: 0 -8px; padding: 6px 8px; border-radius: 6px; }

.btn { height: 34px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 7px; border: 1px solid hsl(var(--input)); background: hsl(var(--background)); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: hsl(var(--muted)); }
.btn.primary { background: hsl(var(--primary)); border-color: hsl(var(--primary)); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ok { background: hsl(var(--success)); border-color: hsl(var(--success)); color: #fff; }
.btn.danger { border-color: hsl(var(--destructive) / .6); color: hsl(0 70% 70%); }
:root:not(.dark) .btn.danger { color: hsl(0 60% 45%); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.btn kbd { background: transparent; border-color: currentColor; color: inherit; opacity: .75; }
.btn svg { width: 15px; height: 15px; }

.play { width: 52px; height: 52px; border-radius: 50%; border: 1px solid hsl(var(--primary) / .6); background: hsl(var(--primary) / .14); color: hsl(var(--primary)); display: grid; place-items: center; flex: none; }
.play svg { width: 22px; height: 22px; }
.play.on { background: hsl(var(--primary)); color: #fff; }
.player { display: flex; align-items: center; gap: 12px; }
.player .wave { flex: 1; height: 44px; display: flex; align-items: center; gap: 2px; min-width: 120px; position: relative; }
.player .wave i { flex: 1; background: hsl(var(--muted-foreground) / .35); border-radius: 2px; min-width: 2px; }
.player .wave i.p { background: hsl(var(--primary)); }
.player .wave .mark { position: absolute; top: -4px; bottom: -4px; width: 0; border-left: 1.5px dashed hsl(var(--warning)); }
.player .meta { font-size: 11.5px; color: hsl(var(--muted-foreground)); min-width: 74px; text-align: right; }
.audio-row { display: grid; gap: 10px; padding: 12px; border-radius: 10px; border: 1px solid hsl(var(--border)); background: hsl(var(--background) / .6); }
.audio-row + .audio-row { margin-top: 10px; }
.audio-row.focus { border-color: hsl(var(--primary) / .7); box-shadow: 0 0 0 3px hsl(var(--primary) / .15); }
.audio-row .lbl { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; flex-wrap: wrap; }
.audio-row .acts { display: flex; gap: 6px; flex-wrap: wrap; }

.split { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
.unit { font-family: var(--ar-font); font-size: 30px; line-height: 1.6; padding: 2px 12px; border-radius: 8px; border: 1px solid hsl(var(--border)); background: hsl(var(--background)); direction: rtl; }
.unit.chg { border-color: hsl(var(--warning) / .7); background: hsl(var(--warning) / .12); }
.unit.sm { font-size: 22px; padding: 0 9px; }
.diffrow { display: grid; grid-template-columns: 74px 1fr; gap: 6px 10px; align-items: center; font-size: 12px; }

.decision-target { outline: 2px solid hsl(var(--primary) / .7); outline-offset: 3px; border-radius: 10px; }

.dbar { flex: none; border-top: 1px solid hsl(var(--border)); background: hsl(var(--card)); padding: 10px 28px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 58px; }
.dbar .sp { flex: 1; }
.dbar .status { font-size: 12.5px; color: hsl(var(--muted-foreground)); display: flex; align-items: center; gap: 8px; }
.dbar .gate { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.dbar .gate svg { width: 16px; height: 16px; color: hsl(var(--muted-foreground)); }
.reasons { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; width: 100%; }
.reasons button { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px; border: 1px solid hsl(var(--border)); background: hsl(var(--background)); font-size: 12.5px; text-align: left; }
.reasons button.on { border-color: hsl(var(--destructive) / .7); background: hsl(var(--destructive) / .1); }
.reasonbox { width: 100%; display: grid; gap: 8px; }
.reasonbox .row { display: flex; gap: 8px; align-items: center; }
.reasonbox input, .field { height: 34px; border-radius: 7px; border: 1px solid hsl(var(--input)); background: hsl(var(--background)); padding: 0 10px; flex: 1; min-width: 0; }
.field.ar { height: 46px; font-size: 24px; text-align: right; }
textarea.field { height: auto; padding: 8px 10px; resize: vertical; }
.err { color: hsl(0 70% 70%); font-size: 12.5px; }
:root:not(.dark) .err { color: hsl(0 60% 45%); }

.pics { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.pic { aspect-ratio: 1; border-radius: 8px; border: 1px solid hsl(var(--border)); background: hsl(var(--background)); display: grid; place-items: center; position: relative; }
.pic svg { width: 60%; height: 60%; }
.pic .x { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: hsl(var(--muted)); font-size: 12px; line-height: 1; }

.hist { font-size: 12px; display: grid; gap: 6px; }

/* empty, loading, error */
.empty { display: grid; place-items: center; align-content: center; text-align: center; padding: 48px 24px; gap: 8px; color: hsl(var(--muted-foreground)); }

.empty .ring svg { width: 24px; height: 24px; color: hsl(var(--secondary)); }
.empty h5 { margin: 6px 0 0; font-size: 15px; color: hsl(var(--foreground)); font-weight: 600; }
.skel { padding: 12px; border-bottom: 1px solid hsl(var(--border) / .7); display: grid; gap: 8px; }
.skel i { display: block; height: 12px; border-radius: 4px; background: linear-gradient(90deg, hsl(var(--muted)) 0, hsl(var(--muted) / .4) 50%, hsl(var(--muted)) 100%); background-size: 200% 100%; animation: sh 1.3s infinite linear; }
@keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.srcerr { margin: 8px 12px 0; padding: 8px 10px; border-radius: 8px; font-size: 12px; border: 1px solid hsl(var(--destructive) / .4); background: hsl(var(--destructive) / .08); display: flex; gap: 8px; align-items: center; }

/* ===================================================================
   State
   =================================================================== */
const S = {
  role: ROLES.lead,
  scenario: "normal",
  items: seedItems(),
  lens: "all",            // a kind, "all", or "lib-families" / "lib-concepts", "v-ai", "v-failed", "v-mine"
  status: "todo",         // todo | done | all
  sort: "usage",
  q: "",
  sel: null,
  checked: new Set(),
  mode: null,             // null | {type:'reject'|'fix'|'fulfil'|'decline'|'split-reject'|'fulfil'} for the open decision
  sub: null,              // null | {type:'family', id} | {type:'concept', slug}
  focus: 0,               // focused decision inside a multi-decision item (blend)
  playing: null,          // {id, t}
  history: [],            // undo stack
  showDetailMobile: false,
};

function needsDecision(it) {
  if (it.kind === "letter") return false;
  return it.state === "todo" || it.state === "failed";
}
function statusPill(it) {
  const st = it.state;
  if (it.kind === "letter") return it.status === "broken" ? `<span class="pill no">File missing</span>` : `<span class="pill neutral">Listen</span>`;
  if (st === "approved") return `<span class="pill ok">${it.kind === "reading" ? "Confirmed" : it.kind === "request" ? "Fulfilled" : "Approved"}</span>`;
  if (st === "rejected") return `<span class="pill no">${it.kind === "request" ? "Declined" : "Rejected"}</span>`;
  if (st === "pseudo") return `<span class="pill no">Noted: not a word</span>`;
  if (st === "wrong") return `<span class="pill no">Noted: respell</span>`;
  if (st === "failed") return `<span class="pill no">${it.kind === "blend" ? "Not voiceable" : "Failed"}</span>`;
  if (!can(KINDS[it.kind].gate)) return `<span class="pill gate">${it.kind === "draft" ? "Lead decides" : "Reviewer decides"}</span>`;
  const t = { spelling: "To review", reading: "To confirm", blend: "Needs review", draft: "Waiting", request: "Open", phrase: it.reason === "flag_mismatch" ? "Confirm again" : "Pending", recording: "Take to hear" }[it.kind];
  return `<span class="pill todo">${t}</span>`;
}

function line2(it) {
  const k = KINDS[it.kind];
  const tag = `<span class="kindtag k-${it.kind}"><span class="dot"></span>${k.one}</span>`;
  let t = "";
  if (it.kind === "spelling") { const w = W[it.w]; t = `${CLASS_LABEL[w.cls]} · used by ${w.usage}${w.flags ? " · " + w.flags.map((f) => FLAG_LABEL[f]).join(", ") : ""}`; }
  if (it.kind === "reading") t = `Read as ${it.candidates.map((c) => W[c].ar).join(", ")}? · family ${W[it.w].family}`;
  if (it.kind === "blend") t = it.failed ? "Full form: not voiceable after 5 attempts" : "Pausal split edited by hand · full form take waits";
  if (it.kind === "draft") t = `${it.node}${it.state === "rejected" ? " · " + esc(it.reason) : ""}`;
  if (it.kind === "request") t = `${it.type} · ${it.node}`;
  if (it.kind === "phrase") t = `${it.sentence ? "Sentence" : "Phrase"} · ${it.problems.length ? "1 word problem" : it.used.length + " use"}`;
  if (it.kind === "recording") t = `${it.sentence ? "Sentence" : "Phrase"} · ${it.take.status === "failed" ? "last take failed" : it.served ? "new take beside the served one" : "first take"}`;
  if (it.kind === "letter") t = `${it.en} · ${it.file}`;
  return `${tag}<span class="t">${esc(t)}</span>${it.waiting ? `<span style="margin-left:auto;white-space:nowrap">${it.waiting}</span>` : ""}`;
}

/* ===================================================================
   Filtering
   =================================================================== */
function inLens(it) {
  const l = S.lens;
  if (l === "all") return it.kind !== "letter" || S.status !== "todo";
  if (l === "v-ai") return (it.kind === "draft" || it.kind === "request") || (it.kind === "blend");
  if (l === "v-failed") return it.state === "failed" || (it.kind === "letter" && it.status === "broken");
  if (l === "v-mine") return !!it.mine;
  return it.kind === l;
}
function inStatus(it) {
  if (it.kind === "letter") return true;
  if (S.status === "todo") return needsDecision(it);
  if (S.status === "done") return !needsDecision(it);
  return true;
}
function matchesQ(it) {
  const q = S.q.trim().toLowerCase();
  if (!q) return true;
  const stripped = q.replace(/[ً-ْٰ]/g, "");
  const hay = [it.ar, it.en, it.node, it.type, it.w && W[it.w].id, it.w && W[it.w].family].join(" ").toLowerCase();
  return hay.includes(q) || hay.replace(/[ً-ْٰ]/g, "").includes(stripped);
}
const KIND_ORDER = Object.keys(KINDS);
function sorted(list) {
  const u = (it) => (it.w ? W[it.w].usage : it.usage ?? 0);
  const wait = (it) => { const m = /(\d+)\s*(min|h|d)/.exec(it.waiting || ""); if (!m) return 0; return +m[1] * { min: 1, h: 60, d: 1440 }[m[2]]; };
  const by = {
    usage: (a, b) => u(b) - u(a),
    oldest: (a, b) => wait(b) - wait(a),
    newest: (a, b) => wait(a) - wait(b),
    kind: (a, b) => KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind),
  }[S.sort];
  return [...list].sort((a, b) => by(a, b) || KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind));
}
function visible() {
  if (S.scenario === "loading") return [];
  return sorted(S.items.filter((it) => inLens(it) && inStatus(it) && matchesQ(it) && !(S.scenario === "partial" && it.kind === "draft")));
}
function counts() {
  const c = {}; let all = 0;
  for (const k of KIND_ORDER) c[k] = 0;
  for (const it of S.items) {
    if (S.scenario === "partial" && it.kind === "draft") continue;
    if (needsDecision(it)) { c[it.kind]++; all++; }
  }
  c.letter = S.items.filter((i) => i.kind === "letter").length;
  return { ...c, all };
}

function railBtn(id, label, n, opts = {}) {
  const on = S.lens === id;
  const hot = n > 0 && opts.hot !== false;
  return `<button class="${on ? "on" : ""} ${opts.cls || ""}" data-lens="${id}" aria-pressed="${on}">
    ${opts.dot ? `<span class="dot"></span>` : opts.icon ? ic(opts.icon) .replace("<svg", '<svg style="width:15px;height:15px;color:hsl(var(--muted-foreground))"') : ""}
    <span>${label}</span>${opts.lock ? `<span class="lock" title="Decisions need ${GATE_TEXT[opts.lock]}">${opts.lock === "lead" ? "Lead" : "Reviewer"}</span>` : ""}
    <span class="n ${hot ? "hot" : ""}">${n ?? ""}</span></button>`;
}
function renderRail() {
  const c = counts();
  const lockFor = (k) => (!can(KINDS[k].gate) ? KINDS[k].gate : null);
  let h = `<h3>To decide</h3>` + railBtn("all", "Everything", c.all, { icon: "inbox" });
  h += `<h3>By kind</h3>`;
  for (const k of KIND_ORDER) {
    if (k === "letter") continue;
    h += railBtn(k, KINDS[k].label, c[k], { dot: true, cls: "k-" + k, lock: lockFor(k) });
  }
  h += `<h3>Listen</h3>` + railBtn("letter", "Letter sounds", c.letter, { dot: true, cls: "k-letter", hot: false });
  h += `<h3>Library</h3>` +
    railBtn("lib-families", "Families", Object.keys(FAMILIES).length, { icon: "layers", hot: false }) +
    railBtn("lib-concepts", "Concepts", Object.keys(CONCEPTS).length, { icon: "shapes", hot: false });
  h += `<h3>Views</h3>` +
    railBtn("v-ai", "From the AI", null, { icon: "sparkle" }) +
    railBtn("v-failed", "Failed audio", S.items.filter((i) => i.state === "failed" || i.status === "broken").length, { icon: "alert", hot: false }) +
    railBtn("v-mine", "Decided by me", S.items.filter((i) => i.mine).length, { icon: "history", hot: false });
  h += `<p class="foot muted">Counts are what waits for a person. Approved, rejected and noted items stay one keystroke away under <b>Decided</b>.</p>`;
  document.getElementById("rail").innerHTML = h;
}

function renderList() {
  const el = document.getElementById("list");
  if (S.lens === "lib-families" || S.lens === "lib-concepts") return renderLibraryList(el);
  const vis = visible();
  const c = counts();
  const kindOpts = [["all", "Everything"], ...KIND_ORDER.map((k) => [k, KINDS[k].label]), ["lib-families", "Families"], ["lib-concepts", "Concepts"]]
    .map(([v, l]) => `<option value="${v}" ${S.lens === v ? "selected" : ""}>${l}${c[v] ? " (" + c[v] + ")" : ""}</option>`).join("");
  const checkedVis = vis.filter((i) => S.checked.has(i.key));
  let h = `<div class="lhead">
    <div class="search">${ic("search")}<input id="q" placeholder="Search Arabic, English, id, node" value="${esc(S.q)}" aria-label="Search" autocomplete="off"><kbd>/</kbd></div>
    <div class="lrow"><select class="sel kindsel" id="kindsel" aria-label="Kind">${kindOpts}</select>
      <div class="seg" role="tablist" aria-label="Status">
        ${[["todo", "To decide"], ["done", "Decided"], ["all", "All"]].map(([v, l]) => `<button role="tab" data-status="${v}" class="${S.status === v ? "on" : ""}" aria-selected="${S.status === v}">${l}</button>`).join("")}
      </div>
      <select class="sel" id="sort" aria-label="Sort" style="margin-left:auto">
        ${[["usage", "Most used first"], ["oldest", "Waiting longest"], ["newest", "Newest"], ["kind", "By kind"]].map(([v, l]) => `<option value="${v}" ${S.sort === v ? "selected" : ""}>${l}</option>`).join("")}
      </select></div>
    ${lensTools()}
    <div class="lmeta"><span>${S.scenario === "loading" ? "Loading..." : vis.length + " shown"} · <button class="linkbtn" data-act="refresh" style="font-size:11.5px">updated just now</button></span><span><kbd>j</kbd> <kbd>k</kbd> move · <kbd>x</kbd> select</span></div>
  </div>`;
  if (checkedVis.length) {
    const bulkOk = checkedVis.every(bulkSafe);
    h += `<div class="bulk"><b>${checkedVis.length} selected</b><span class="sp"></span>
      ${bulkOk ? `<button class="btn sm ok" data-act="bulk-approve">Approve all <kbd>A</kbd></button>` : `<span class="muted" title="Bulk approve is only for spellings and splits with no flags">Not all can be approved together</span>`}
      <button class="btn sm ghost" data-act="bulk-clear">Clear</button></div>`;
  }
  if (S.scenario === "partial") {
    h += `<div class="srcerr">${ic("alert").replace("<svg", '<svg style="width:15px;height:15px;flex:none"')}<span>AI drafts could not be loaded: the request timed out. Everything else is current.</span><span class="sp"></span><button class="btn sm" data-act="retry">Retry</button></div>`;
  }
  h += `<div class="items" id="items" role="listbox" aria-label="Items">`;
  if (S.scenario === "loading") {
    h += Array.from({ length: 7 }, (_, i) => `<div class="skel"><i style="width:${40 + (i * 13) % 45}%;margin-left:auto;height:18px"></i><i style="width:${55 + (i * 7) % 30}%"></i></div>`).join("");
  } else if (!vis.length) {
    h += emptyState();
  } else {
    for (const it of vis) {
      const on = S.sel === it.key;
      const safe = bulkSafe(it);
      h += `<div class="item ${on ? "on" : ""} ${needsDecision(it) || it.kind === "letter" ? "" : "done"}" role="option" aria-selected="${on}" data-key="${it.key}" id="row-${it.key}">

        <div class="top">${it.latin ? `<span class="ar lat">${esc(it.ar)}</span>` : ar(it.ar)}${statusPill(it)}</div>
        <div class="line2">${line2(it)}</div></div>`;
    }
  }
  h += `</div>`;
  el.innerHTML = h;
}

/* Tools that belong to one kind: the old pages' header controls, kept where they make sense. */
function lensTools() {
  if (S.lens === "spelling") return `<div class="lrow"><select class="sel" aria-label="Class or flag" style="flex:1"><option>Every class</option><option>Fully vowelled</option><option>Partly vowelled</option><option>Case-ending variants</option><option>Two consonants</option><option>Many vowelings of the same letters</option><option>No activity uses it</option></select><button class="btn sm" data-act="export">Export decisions</button></div>`;
  if (S.lens === "blend") return `<div class="lrow"><button class="btn sm" data-act="ai-batch" ${S.scenario === "recoff" ? 'disabled title="The AI check is turned off."' : ""}>${ic("sparkle")} AI check the listed words</button><span class="muted" style="font-size:11.5px">up to 50</span></div>`;
  if (S.lens === "draft") return `<div class="lrow"><select class="sel" aria-label="Curriculum" style="flex:1"><option>Every curriculum</option><option>Kalam Readers</option></select><select class="sel" aria-label="Node" style="flex:1"><option>Every node</option><option>Letter ta, lesson</option><option>Letter ta, practice</option></select><button class="btn sm" data-act="request-draft">Request drafts</button></div>`;
  return "";
}

function emptyState() {
  const lensName = S.lens === "all" ? "" : (KINDS[S.lens]?.label || "this view").toLowerCase();
  if (S.q) return `<div class="empty"><h5>No match for "${esc(S.q)}"</h5><p>Search looks at the Arabic with and without harakat, the English, ids and node titles.</p><button class="btn sm" data-act="clear-q">Clear search</button></div>`;
  if (S.status === "todo") {
    const done = S.items.filter((i) => !needsDecision(i) && (S.lens === "all" || i.kind === S.lens) && i.kind !== "letter").length;
    return `<div class="empty"><div class="ring">${ic("check")}</div><h5>Nothing waits${lensName ? " in " + esc(lensName) : ""}</h5>
      <p>${done} decided so far. New items arrive when authors save words, phrases or activities, and when the AI drafts.</p>
      <button class="btn sm" data-status="done">See what was decided</button></div>`;
  }
  return `<div class="empty"><h5>Nothing here yet</h5></div>`;
}

function bulkSafe(it) {
  if (!needsDecision(it)) return false;
  if (it.kind === "spelling") { const w = W[it.w]; return w.cls === "real_full" && !(w.flags && w.flags.length); }
  return false;
}

   Library lists (Families, Concepts) as browse lenses

function renderLibraryList(el) {
  const fam = S.lens === "lib-families";
  let h = `<div class="lhead"><div class="search">${ic("search")}<input id="q" placeholder="${fam ? "Search id, gloss or headword" : "Search slug or name"}" value="${esc(S.q)}" aria-label="Search"><kbd>/</kbd></div>

    <div class="seg">${fam ? '<button class="on">All families</button><button>No concept</button>' : '<button class="on">All concepts</button><button>No family</button><button>No picture</button>'}</div>
    <button class="btn sm" style="margin-left:auto" data-act="${fam ? "new-family" : "new-concept"}">New ${fam ? "family" : "concept"}</button></div></div><div class="items">`;
  const q = S.q.trim().toLowerCase();
  if (fam) {
    for (const f of Object.values(FAMILIES)) {
      if (q && !(f.id + f.gloss + W[f.head].ar).toLowerCase().includes(q)) continue;
      const on = S.sub && S.sub.type === "family" && S.sub.id === f.id;
      const pending = f.members.filter((m) => !W[m].reviewed).length;
      h += `<div class="item ${on ? "on" : ""}" data-family="${f.id}"><span></span><div class="top"><span class="ar lat">${esc(f.gloss)}</span>${ar(W[f.head].ar)}</div>
        <div class="line2"><span class="mono">${f.id}</span><span>${f.members.length} spellings</span>${pending ? `<span class="pill todo">${pending} not reviewed</span>` : ""}<span style="margin-left:auto">${f.concept ? "concept " + f.concept : "no concept"}</span></div></div>`;
    }
  } else {
    for (const c of Object.values(CONCEPTS)) {
      if (q && !(c.slug + c.en + c.ar).toLowerCase().includes(q)) continue;
      const on = S.sub && S.sub.type === "concept" && S.sub.slug === c.slug;
      h += `<div class="item ${on ? "on" : ""}" data-concept="${c.slug}"><span></span><div class="top"><span class="ar lat">${esc(c.en)}</span>${ar(c.ar)}</div>
        <div class="line2"><span class="mono">${c.slug} · ${c.kind}</span><span style="margin-left:auto">${c.pics.length ? c.pics.length + " picture" + (c.pics.length > 1 ? "s" : "") : '<span class="pill todo">no picture</span>'} · ${c.families.length ? c.families.length + " family" : '<span class="pill neutral">no family</span>'}</span></div></div>`;
    }
  }
  el.innerHTML = h + `</div>`;
}

/* ===================================================================
   Detail pane
   =================================================================== */
const cur = () => S.items.find((i) => i.key === S.sel);

function renderDetail() {
  const el = document.getElementById("detail");
  document.getElementById("ws").classList.toggle("has-detail", !!(S.sel || S.sub) && S.showDetailMobile);
  if (S.sub) return renderSub(el);
  const it = cur();
  if (S.scenario === "loading") { el.innerHTML = `<div class="dscroll"><div class="dinner single"><div class="hero"><div class="skel" style="border:0"><i style="width:30%"></i><i style="width:50%;height:44px;margin-left:auto"></i><i style="width:70%"></i></div></div></div></div>`; return; }
  if (!it) {
    el.innerHTML = `<div class="dscroll"><div class="empty" style="height:100%">${S.lens.startsWith("lib-") ? `<h5>Pick a ${S.lens === "lib-families" ? "family" : "concept"}</h5><p>Or create one. Families and concepts also open from any word you review.</p>` : `<div class="ring">${ic("inbox")}</div><h5>${visible().length ? "Pick an item" : "All clear"}</h5><p>${visible().length ? "Press <kbd>j</kbd> to start with the first one." : "Nothing in this view needs you right now."}</p>`}</div></div>`;
    return;
  }
  const fn = { spelling: dSpelling, reading: dReading, blend: dBlend, draft: dDraft, request: dRequest, phrase: dPhrase, recording: dRecording, letter: dLetter }[it.kind];
  const { main, ctx, bar } = fn(it);
  el.innerHTML = `<div class="dscroll"><div class="dinner ${ctx ? "" : "single"}">
      <div class="crumbs"><button class="backlink linkbtn" data-act="back">Back to the list</button><span>${KINDS[it.kind].label}</span><span>/</span><span class="mono">${esc(it.w ? W[it.w].id : it.key)}</span></div>
      <div class="col">${main}</div>${ctx ? `<aside class="col ctx">${ctx}</aside>` : ""}
    </div></div><div class="dbar" id="dbar">${bar}</div>`;
}

function hero(it, { big, sub, extra = "", play = null, long = false }) {
  const k = KINDS[it.kind];
  return `<div class="hero">
    <div class="eyebrow"><span class="kindtag k-${it.kind}"><span class="dot"></span>${k.one}</span>${statusPill(it)}${it.waiting ? `<span>waiting ${it.waiting}</span>` : ""}${it.by ? `<span>by ${esc(it.by)}, ${esc(it.at)}</span>` : ""}</div>
    <div class="big">${play ? playBtn(play) : ""}<div style="flex:1;min-width:0;text-align:right">${big}</div></div>
    ${sub ? `<div class="gloss">${sub}</div>` : ""}${extra}</div>`;
}
function playBtn(id) {
  const on = S.playing && S.playing.id === id;
  return `<button class="play ${on ? "on" : ""}" data-play="${id}" aria-label="${on ? "Pause" : "Play"}" title="Play (space)">${ic(on ? "pause" : "play")}</button>`;
}
function wave(id, dur, marks = []) {
  let seed = [...id].reduce((a, c) => a + c.charCodeAt(0), 7);
  const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  const n = 56, p = S.playing && S.playing.id === id ? S.playing.t : 0;
  const bars = Array.from({ length: n }, (_, i) => { const env = Math.sin(Math.PI * (i + 1) / (n + 1)); return `<i class="${i / n < p ? "p" : ""}" style="height:${Math.round(10 + 80 * env * (0.45 + rnd() * 0.55))}%"></i>`; }).join("");
  return `<div class="player">${playBtn(id)}<div class="wave">${bars}${marks.map((m) => `<span class="mark" style="left:${m * 100}%"></span>`).join("")}</div><span class="meta">${dur ? dur.toFixed(1) + " s" : ""}</span></div>`;
}
function bar(actions, status = "") {
  return `<span class="status">${status}</span><span class="sp"></span>${actions}`;
}
function gateBar(gate, statusText) {
  return `<div class="gate">${ic("lock")}<span>${statusText} <span class="muted">Only ${GATE_TEXT[gate]} can decide this. You see the status, not the buttons.</span></span></div>`;
}
function nextHint() { return `<span class="muted" style="font-size:12px">then moves to the next</span>`; }

function familyCard(fid, currentWordKey) {
  if (!fid) {
    return `<div class="card"><h4>Family</h4><p class="muted" style="margin:0 0 8px;font-size:12.5px">Not in a family yet.</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" data-act="join-family">Add to a family <kbd>f</kbd></button><button class="btn sm ghost" data-act="new-family">New family</button></div></div>`;
  }
  const f = FAMILIES[fid];
  const mem = f.members.map((m) => {

    return `<div class="mem ${m === currentWordKey ? "cur" : ""}">${ar(w.ar)}${f.head === m ? '<span class="pill info">Headword</span>' : ""}<span class="sp"></span>${st}</div>`;

}
function conceptCard(slug) {
  if (!slug) return `<div class="card"><h4>Concept and picture</h4><p class="muted" style="margin:0 0 8px;font-size:12.5px">A family gets its picture through a concept.</p><button class="btn sm" data-act="link-concept">Link a concept <kbd>c</kbd></button></div>`;
  const c = CONCEPTS[slug];

    <div style="display:flex;gap:10px;align-items:center"><div class="pic" style="width:64px">${art(c.art)}</div><div><b>${esc(c.en)}</b> ${ar(c.ar)}<div class="muted mono">${c.slug} · ${c.kind}</div><div class="muted" style="font-size:12px">${c.pics.length} picture${c.pics.length === 1 ? "" : "s"}</div></div></div></div>`;
}
function art(kind) {
  const a = {
    book: '<path d="M8 14c8-4 16-4 24 0v28c-8-4-16-4-24 0Z" fill="hsl(211 65% 55%)"/><path d="M32 14c8-4 16-4 24 0v28c-8-4-16-4-24 0Z" fill="hsl(211 65% 68%)"/>',
    bear: '<circle cx="20" cy="18" r="7" fill="hsl(25 45% 38%)"/><circle cx="44" cy="18" r="7" fill="hsl(25 45% 38%)"/><circle cx="32" cy="34" r="17" fill="hsl(25 45% 45%)"/><ellipse cx="32" cy="40" rx="8" ry="6" fill="hsl(30 45% 70%)"/><circle cx="26" cy="30" r="2" fill="#222"/><circle cx="38" cy="30" r="2" fill="#222"/>',
    person: '<circle cx="32" cy="20" r="9" fill="hsl(30 50% 65%)"/><path d="M16 52c2-12 9-18 16-18s14 6 16 18Z" fill="hsl(160 55% 45%)"/>',

function usedCard(lines, title = "Where it is used") {

/* ---------- spelling ---------- */
function suggest(w) {
  if (w.cls === "real_partial") return "Partly vowelled: correct the spelling to carry every haraka, then approve.";
  if (w.cls === "case_variant") return `Case-ending variant of ${w.base}: approve it if the ending is a real form.`;
  if (w.flags && (w.flags.includes("vowel_permutations") || w.flags.includes("two_letters"))) return "Check it is a real word and correctly vowelled; if it is a drill, record Not a real word.";
  return "Approve if it is a real word and correctly vowelled.";
}
function dSpelling(it) {
  const w = W[it.w];
  const flags = (w.flags || []).map((f) => `<span class="chip flag">${FLAG_LABEL[f]}</span>`).join("");
  const others = (w.others || []).filter((o) => o !== w.ar);
  let fix = "";
  if (S.mode && S.mode.type === "fix") {
    fix = `<div class="card"><h4>Correct the harakat <span class="muted">letters stay the same</span></h4>
      <div style="display:grid;gap:8px"><input class="field ar" id="fixin" lang="ar" dir="rtl" value="${esc(S.mode.value ?? w.ar)}" aria-label="Corrected spelling">
      <div class="diffrow"><span class="muted">Now</span>${ar(w.ar, "unit sm")}<span class="muted">Corrected</span><span id="fixprev">${ar(S.mode.value ?? w.ar, "unit sm")}</span></div>
      ${S.mode.err ? `<div class="err">${esc(S.mode.err)}</div>` : ""}
      <p class="muted" style="margin:0;font-size:12px">Saved as a shared note for the clean-up run. ${w.usage === 0 ? "This spelling is unused, so it can be respelled now (PUT /words/:id/spelling)." : "Activities use it, so the bank is not changed here."}</p></div></div>`;
  }
  const main = hero(it, {
    big: ar(w.ar),
    sub: `<b>${CLASS_LABEL[w.cls]}</b> · rank ${w.rank} of 760 by use${w.base ? ` · base ${ar(w.base)}` : ""}`,
    extra: `${flags ? `<div class="chips" style="margin-top:10px">${flags}</div>` : ""}<div class="say">${esc(suggest(w))}</div>
      ${it.state === "pseudo" ? `<div class="say err">Noted as not a real word. The clean-up run marks it a practice word.</div>` : ""}
      ${it.state === "wrong" ? `<div class="say err">Noted: respell as ${ar(it.fix)}.</div>` : ""}`,
  }) + fix +
    (others.length ? `<div class="card"><h4>Same letters, other spellings <span class="muted">${w.sib ? w.sib + " other vowelings live" : "an unvowelled spelling only"}</span></h4><div class="chips">${others.map((o) => `<span class="chip">${ar(o)}</span>`).join("")}</div></div>` : "");
  const ctx = familyCard(w.family, it.w) + (w.family ? conceptCard(FAMILIES[w.family].concept) : conceptCard(null)) +
    usedCard([`${w.usage} ${w.usage === 1 ? "activity" : "activities"}`, `${w.target ?? 0} as the target, ${w.distr ?? 0} only as a distractor`, `<button class="linkbtn">Open the activities</button>`]) +
    historyCard(it.state === "approved" && it.by ? [[it.at, `Approved by ${it.by}`]] : null);
  let b;
  if (S.mode && S.mode.type === "fix") {
    b = bar(`<button class="btn ghost" data-act="cancel">Cancel <kbd>esc</kbd></button><button class="btn primary" data-act="save-fix">Save note <kbd>enter</kbd></button>`, "Type the corrected spelling.");
  } else if (it.state === "approved") {
    b = bar(`<button class="btn" data-act="withdraw">Withdraw approval</button>`, `Approved${it.by ? " by " + esc(it.by) + ", " + esc(it.at) : ""}. It is on the allow-list.`);
  } else if (it.state === "pseudo" || it.state === "wrong") {
    b = bar(`<button class="btn" data-act="clear-note">Clear note</button>`, "Noted for the clean-up run. The bank is unchanged until it runs.");
  } else {
    b = bar(`<button class="btn" data-act="pseudo">Not a real word <kbd>p</kbd></button>
      <button class="btn" data-act="fix">Wrong harakat <kbd>h</kbd></button>
      <button class="btn ok" data-act="approve">${ic("check")} Approve <kbd>a</kbd></button>`, nextHint());
  }
  return { main, ctx, bar: b };
}

/* ---------- reading (reads-as) ---------- */
function dReading(it) {
  const w = W[it.w];
  const pick = S.mode && S.mode.type === "pick" ? S.mode.i : 0;
  const main = hero(it, {
    big: ar(w.ar),
    sub: `No harakat. The app needs to know how it is read before a child sees it.`,
    extra: `<div class="say">Pick the fully vowelled spelling with the same letters. The server checks the letters, the family and that the target is not itself read as another row.</div>`,
  }) + `<div class="card"><h4>Read as</h4>${it.state === "approved"
      ? `<div class="mem">${ar(W[it.candidates[0]].ar)}<span class="sp"></span><span class="pill ok">Confirmed</span></div>`

      <p class="muted" style="font-size:12px;margin:10px 0 0">No candidate? Add the vowelled spelling to the library first, then confirm.</p></div>`;
  const ctx = familyCard(w.family, it.w) + conceptCard(FAMILIES[w.family]?.concept) + usedCard([`${w.usage} activity`]);
  const b = it.state === "approved"

  return { main, ctx, bar: b };
}

/* ---------- blend ---------- */
function blendTargets(it) {
  const t = [];
  it.forms.forEach((f, fi) => {
    if (f.split === "todo") t.push({ type: "split", fi });
    f.takes.forEach((tk, ti) => { if (tk.status === "needs_review") t.push({ type: "take", fi, ti }); });
  });
  return t;
}
function dBlend(it) {
  const targets = blendTargets(it);
  const ft = targets[Math.min(S.focus, Math.max(0, targets.length - 1))];
  const isF = (type, fi, ti) => ft && ft.type === type && ft.fi === fi && (ti === undefined || ft.ti === ti);
  const offNote = S.scenario === "recoff" ? `<div class="say calm">Audio generation is turned off. Generate and Regenerate are off; you can still review the takes.</div>` : "";
  let main = hero(it, { big: ar(it.ar), sub: `<b>${esc(it.en)}</b> · used by ${it.usage} ${it.usage === 1 ? "activity" : "activities"}`, extra: offNote });
  for (const [fi, f] of it.forms.entries()) {
    let split = "";
    if (f.units) {
      const diff = f.override ? `<div class="diffrow" style="margin-top:8px"><span class="muted">Rules</span><div class="split">${f.rules.map((u) => `<span class="unit sm">${esc(u)}</span>`).join("")}</div>
        <span class="muted">Edited</span><div class="split">${f.units.map((u, i) => `<span class="unit sm ${f.rules[i] !== u ? "chg" : ""}">${esc(u)}</span>`).join("")}</div></div>` : "";
      split = `<div class="audio-row ${isF("split", fi) ? "focus" : ""}">
        <div class="lbl">Split ${f.split === "todo" ? '<span class="pill todo">Waits for review</span>' : '<span class="pill ok">Approved</span>'}<span class="muted" style="font-weight:400">Harakat: ${esc(f.harakat)}. ${f.override ? "Edited by the author." : "As the rules split it."}</span></div>
        <div class="split">${f.units.map((u) => `<span class="unit">${esc(u)}</span>`).join("")}</div>${diff}
        ${f.flags && f.flags.length ? `<div class="chips">${f.flags.map((x) => `<span class="chip flag">${esc(x.t)} (${x.src})</span>`).join("")}</div>` : ""}
        ${isF("split", fi) && S.mode && S.mode.type === "split-reject" ? `<div class="reasonbox"><input class="field" id="splitnote" placeholder="Say why the split is wrong (needed)" value="${esc(S.mode.note || "")}">${S.mode.err ? `<div class="err">${esc(S.mode.err)}</div>` : ""}</div>` : ""}
      </div>`;
    }
    const takes = f.takes.map((tk, ti) => {
      const st = { ready: '<span class="pill ok">Ready</span>', needs_review: '<span class="pill todo">Needs review</span>', pending: '<span class="pill info">Being made</span>', not_voiceable: '<span class="pill no">Not voiceable</span>', failed: '<span class="pill no">Failed</span>', rejected: '<span class="pill neutral">Rejected</span>' }[tk.status];
      const playable = ["ready", "needs_review"].includes(tk.status);
      return `<div class="audio-row ${isF("take", fi, ti) ? "focus" : ""}"><div class="lbl">${tk.kind} take ${st}${tk.by ? `<span class="muted" style="font-weight:400">approved by ${tk.by}</span>` : ""}${tk.attempts ? `<span class="muted" style="font-weight:400">${tk.attempts} of 5 attempts</span>` : ""}</div>
        ${playable ? wave(tk.id, tk.dur, tk.marks || []) : tk.status === "pending" ? `<div class="muted" style="font-size:12.5px">Being made. The list looks again every 10 seconds.</div>` : `<div class="say err" style="margin:0">${esc(tk.error)}</div>`}
        ${playable && tk.marks ? `<div class="muted" style="font-size:12px">Dashed lines are the syllable marks. <button class="linkbtn">Fix marks</button></div>` : ""}
        ${isF("take", fi, ti) && S.mode && S.mode.type === "reject" ? reasonPicker(TAKE_REASONS) : ""}</div>`;
    }).join("");
    const gen = S.scenario === "recoff" ? "" : `<div style="display:flex;gap:6px;margin-top:10px"><button class="btn sm">${ic("wand")} ${f.takes.length ? "Regenerate" : "Generate"}</button><button class="btn sm ghost">Settings</button></div>`;
    main += `<div class="card"><h4>${f.label} ${ar(f.text)}</h4>${split}${takes ? `<div style="margin-top:10px">${takes}</div>` : ""}${gen}</div>`;
  }
  const ctx = familyCard(it.family, "kitab") + (it.family ? conceptCard(FAMILIES[it.family].concept) : "") +
    `<div class="card"><h4>AI check</h4><p class="muted" style="font-size:12.5px;margin:0 0 8px">Not AI checked yet. The check flags wrong marks and likely practice words.</p><button class="btn sm" ${S.scenario === "recoff" ? 'disabled title="The AI check is turned off."' : ""}>${ic("sparkle")} Run AI check on this word</button></div>`;
  let b;
  if (!targets.length) b = bar("", it.state === "failed" ? "Nothing to approve: the take is not voiceable. Change the spelling or the split, then generate again." : "Everything on this word is reviewed.");
  else if (S.mode && (S.mode.type === "reject" || S.mode.type === "split-reject")) b = bar(`<button class="btn ghost" data-act="cancel">Cancel <kbd>esc</kbd></button><button class="btn danger" data-act="confirm-reject">Reject <kbd>enter</kbd></button>`, ft.type === "split" ? "A rejected split needs a note." : "Pick a reason with its number.");
  else b = bar(`<button class="btn danger" data-act="reject">Reject ${ft.type === "split" ? "split" : "take"} <kbd>r</kbd></button><button class="btn ok" data-act="approve">${ic("check")} Approve ${ft.type === "split" ? "split" : "take"} <kbd>a</kbd></button>`,
      `${targets.length} decision${targets.length > 1 ? "s" : ""} on this word · <kbd>tab</kbd> next decision${ft.type === "take" ? " · <kbd>space</kbd> play" : ""}`);
  return { main, ctx, bar: b };
}
function reasonPicker(list) {
  const r = S.mode.reason;
  return `<div class="reasonbox"><div class="reasons">${list.map(([v, l], i) => `<button class="${r === v ? "on" : ""}" data-reason="${v}"><kbd>${i < 9 ? i + 1 : i === 9 ? "0" : "-"}</kbd>${esc(l)}</button>`).join("")}</div>
    <input class="field" id="rnote" placeholder="Note ${r === "other" ? "(needed)" : "(optional)"}" value="${esc(S.mode.note || "")}" maxlength="500">${S.mode.err ? `<div class="err">${esc(S.mode.err)}</div>` : ""}</div>`;
}

/* ---------- AI draft ---------- */
function dDraft(it) {
  const p = it.prov;
  const preview = it.type === "grid_tap"
    ? (() => { const cells = []; for (let i = 0; i < it.config.total; i++) cells.push(i % 3 === 0 && cells.filter((c) => c.t).length < it.config.targetCount ? { t: true, l: it.config.target } : { t: false, l: it.config.distractors[i % 2] }); return `<div class="preview-grid" dir="rtl">${cells.map((c) => `<span class="${c.t ? "t" : ""}">${c.l}</span>`).join("")}</div><p class="muted" style="font-size:12px;margin:8px 0 0">Tap every ${ar(it.config.target)}: ${it.config.targetCount} targets among ${it.config.total}, distractors ${it.config.distractors.map((d) => ar(d)).join(" ")}. The app shuffles the grid.</p>`; })()
    : `<div class="wordtap">${it.config.word.map((s, i) => `<span class="${it.config.indices.includes(i) ? "t" : ""}">${s}</span>`).join("")}</div><p class="muted" style="font-size:12px;margin:8px 0 0">Tap the ${ar(it.config.letter)} (${it.config.form}) in ${ar(it.config.wordText)}, a practice word from the reviewed library.</p>`;
  const checks = p.checks.map(([c, s]) => `<span class="chip ${s}">${c}: ${s}</span>`).join("");
  const main = hero(it, {
    big: `<div style="text-align:left;font-size:26px;font-weight:600;line-height:1.3;padding:6px 0">${esc(it.ar)}</div>`,
    sub: `in <b>${esc(it.node)}</b> · <span class="mono">${it.type}</span>`,
    extra: `<div class="say">Approving does not publish. After approval, publish it from the builder as usual.</div>${it.state === "rejected" ? `<div class="say err">Rejected: ${esc(it.reason)}</div>` : ""}`,
  }) + `<div class="card"><h4>What the child sees <button class="linkbtn">Open in the builder <kbd>o</kbd></button></h4>${preview}</div>
     <div class="card"><h4>Save checks</h4><div class="chips">${checks}</div>${p.checks.some(([, s]) => s === "note") ? `<p class="muted" style="font-size:12px;margin:8px 0 0">A note is information, never a failure.</p>` : ""}</div>
     ${S.mode && S.mode.type === "reject" ? `<div class="card"><h4>Reject the draft</h4><div class="reasonbox"><input class="field" id="rnote" placeholder="Reason (optional)" value="${esc(S.mode.note || "")}"></div></div>` : ""}`;
  const ctx = `<div class="card"><h4>Provenance</h4><dl class="kv"><dt>Model</dt><dd>${esc(p.model)}</dd><dt>Template</dt><dd class="mono">${p.template}</dd><dt>Prompt</dt><dd class="mono">${p.prompt}</dd><dt>Exemplars</dt><dd>${p.exemplars || "none"}</dd>${p.required ? `<dt>Required form</dt><dd>${p.required}</dd>` : ""}<dt>Requested</dt><dd>by Owner, ${it.waiting || "3 d"} ago</dd></dl></div>
    <div class="card"><h4>More drafts for this node</h4><div style="display:flex;gap:6px;flex-wrap:wrap"><select class="sel"><option>Grid tap (themed hunts)</option><option>Tap the letter in a word</option></select><button class="btn sm" ${S.scenario === "recoff" ? "disabled" : ""}>Request a draft</button></div>${S.scenario === "recoff" ? `<p class="muted" style="font-size:12px;margin:8px 0 0">Draft generation is switched off right now.</p>` : ""}</div>`;
  let b;
  if (it.state !== "todo") b = bar("", it.state === "rejected" ? `Rejected by ${esc(it.by)}, ${esc(it.at)}. A rejected draft cannot be approved; request a new one.` : "Approved, not published.");
  else if (!can("lead")) b = gateBar("lead", "Waiting for approval.");
  else if (S.mode && S.mode.type === "reject") b = bar(`<button class="btn ghost" data-act="cancel">Cancel <kbd>esc</kbd></button><button class="btn danger" data-act="confirm-reject">Reject draft <kbd>enter</kbd></button>`, "");
  else b = bar(`<button class="btn" data-act="open-builder">Open in builder <kbd>o</kbd></button><button class="btn danger" data-act="reject">Reject <kbd>r</kbd></button><button class="btn ok" data-act="approve">${ic("check")} Approve <kbd>a</kbd></button>`, nextHint());
  return { main, ctx, bar: b };
}

/* ---------- word request ---------- */
function dRequest(it) {
  const pool = ["kitab", "tin", "tamru"].filter((k) => W[k].reviewed);
  const fulfil = S.mode && S.mode.type === "fulfil";
  const main = hero(it, {
    big: `<div style="text-align:left;font-size:28px;font-weight:600;line-height:1.3;padding:6px 0">"${esc(it.ar)}"</div>`,
    sub: `The generator needed this for <b>${esc(it.type)}</b> in ${esc(it.node)}, letters ${it.letters.map((l) => ar(l)).join(" ")}`,
    extra: `<div class="say">Fulfil with a reviewed, live, real word, or decline.</div>`,
  }) + (fulfil ? `<div class="card"><h4>Pick the reviewed word <span class="muted">reviewed, not retired, not a drill</span></h4><input class="field" placeholder="Filter" style="width:100%"><div class="picker">${pool.map((k, i) => `<button data-fulfil="${k}"><kbd>${i + 1}</kbd>${ar(W[k].ar)}<span class="mono muted">${W[k].id}</span><span class="muted" style="margin-left:auto">${W[k].family ? "family " + W[k].family : ""}</span></button>`).join("")}</div></div>` : "") +
    (S.mode && S.mode.type === "reject" ? `<div class="card"><h4>Decline</h4><input class="field" id="rnote" placeholder="Reason (optional)" style="width:100%" value="${esc(S.mode.note || "")}"></div>` : "");
  const ctx = `<div class="card"><h4>Asked by</h4><dl class="kv"><dt>Node</dt><dd>${esc(it.node)}</dd><dt>Activity</dt><dd class="mono">${it.type}</dd><dt>Opened</dt><dd>${it.waiting} ago</dd></dl></div>`;
  let b;
  if (it.state !== "todo") b = bar("", it.state === "approved" ? `Fulfilled with ${ar(W[it.fulfilled].ar)}.` : "Declined.");
  else if (fulfil) b = bar(`<button class="btn ghost" data-act="cancel">Cancel <kbd>esc</kbd></button>`, "Pick with a number or click.");
  else if (S.mode && S.mode.type === "reject") b = bar(`<button class="btn ghost" data-act="cancel">Cancel <kbd>esc</kbd></button><button class="btn danger" data-act="confirm-reject">Decline request <kbd>enter</kbd></button>`, "");
  else b = bar(`<button class="btn danger" data-act="reject">Decline <kbd>r</kbd></button><button class="btn ok" data-act="approve">Fulfil <kbd>a</kbd></button>`, nextHint());
  return { main, ctx, bar: b };
}

/* ---------- phrase ---------- */
function dPhrase(it) {
  const reasonLine = it.reason === "flag_mismatch" ? "Approved as the other kind (phrase or sentence); confirm it again." : it.reason === "unreviewed" ? "No reviewer has approved it yet." : "";
  const words = it.ar.split(" ");
  const main = hero(it, {
    big: ar(it.ar, words.length > 3 ? "long" : ""),
    sub: `<b>${it.sentence ? "Sentence" : "Phrase"}</b> · ${words.length} words${reasonLine && it.state === "todo" ? " · " + reasonLine : ""}`,
    extra: `${it.problems.length ? `<div class="say warn">${it.problems.map(esc).join("<br>")} <button class="linkbtn" data-act="goto-word">Review the word</button></div>` : ""}
      <div class="say">A native reader checks the words, the harakat and the case endings together. The reviewer should not be the phrase's author (team rule).</div>`,
  }) + `<div class="card"><h4>Word by word <span class="muted">each must be a reviewed word</span></h4><div class="split">${words.map((x) => `<span class="unit sm">${esc(x)}</span>`).join("")}</div></div>` +
    (it.state === "approved" ? `<div class="card"><h4>Recording</h4><p class="muted" style="font-size:12.5px;margin:0">Approved phrases get a whole-phrase recording. ${S.items.some((r) => r.kind === "recording" && r.ar === it.ar) ? `<button class="linkbtn" data-goto="rc-bayt">Open its recording</button>` : ""}</p></div>` : `<div class="card"><h4>Recording</h4><p class="muted" style="font-size:12.5px;margin:0">Approve the phrase before recording it.</p></div>`);
  const ctx = usedCard(it.used.map(esc)) + historyCard(it.state === "approved" ? [[it.at, `Approved by ${it.by}`]] : null);
  let b;
  if (it.state === "approved") b = can("phrase") ? bar(`<button class="btn" data-act="withdraw">Revoke</button>`, `Approved by ${esc(it.by)}, ${esc(it.at)}.`) : gateBar("phrase", "Approved.");
  else if (!can("phrase")) b = gateBar("phrase", "Pending.");
  else b = bar(`<button class="btn ok" data-act="approve" ${it.problems.length ? 'disabled title="Fix the word problems first"' : ""}>${ic("check")} Approve ${it.sentence ? "sentence" : "phrase"} <kbd>a</kbd></button>`, it.problems.length ? "A word problem blocks approval." : nextHint());
  return { main, ctx, bar: b };
}

/* ---------- recording ---------- */
function dRecording(it) {
  const off = S.scenario === "recoff";
  const tk = it.take;
  const takeRow = tk.status === "failed"
    ? `<div class="audio-row"><div class="lbl">Latest take <span class="pill no">Failed</span></div><div class="say err" style="margin:0">${esc(tk.error)}</div></div>`
    : `<div class="audio-row focus"><div class="lbl">New take <span class="pill todo">Needs review</span></div>${wave(tk.id, tk.dur)}${S.mode && S.mode.type === "reject" ? reasonPicker(PHRASE_REASONS) : ""}</div>`;
  const servedRow = it.served ? `<div class="audio-row"><div class="lbl">Served now <span class="pill ok">Approved</span><span class="muted" style="font-weight:400">what children hear today</span></div>${wave(it.served.id, it.served.dur)}<div class="muted" style="font-size:12px"><kbd>shift</kbd> <kbd>space</kbd> plays this one to compare</div></div>` : "";
  const offNote = off ? `<div class="say calm">${ic("mic").replace("<svg", '<svg style="width:15px;height:15px;vertical-align:-3px;margin-right:6px"')}Recording is switched off until the owner turns it on. ${tk.status === "needs_review" ? "You can still hear and decide the takes already made." : "Nothing else needs you here for now."}</div>` : "";
  const main = hero(it, {
    big: ar(it.ar, it.ar.split(" ").length > 3 ? "long" : ""),
    sub: `<b>${it.sentence ? "Sentence" : "Phrase"}</b> · approved text · ${tk.status === "failed" ? "the last recording failed" : it.served ? "a new take waits beside the served one" : "a recording waits for review"}`,
    extra: offNote,
  }) + `<div class="card"><h4>Takes</h4>${takeRow}${servedRow}
      ${!off && can("phrase") ? `<div style="display:flex;gap:6px;margin-top:10px"><button class="btn sm" data-act="regen">${ic("wand")} Regenerate <kbd>g</kbd></button><button class="btn sm ghost">Settings</button></div>` : ""}</div>`;
  const ctx = historyCard(it.history) + `<div class="card"><h4>Text</h4><p class="muted" style="font-size:12.5px;margin:0">The recording is of the approved text only. If the text changes, older takes go out of date and need a new one.</p></div>`;
  let b;
  if (!can("phrase")) b = gateBar("phrase", tk.status === "failed" ? "The last recording failed." : "A recording waits for review.");
  else if (tk.status === "failed") b = off ? bar("", "Recording is off, so there is nothing to do here now.") : bar(`<button class="btn primary" data-act="regen">${ic("wand")} Make a new take <kbd>g</kbd></button>`, "The voice service may be busy; try again.");
  else if (S.mode && S.mode.type === "reject") b = bar(`<button class="btn ghost" data-act="cancel">Cancel <kbd>esc</kbd></button><button class="btn danger" data-act="confirm-reject">Reject take <kbd>enter</kbd></button>`, "Pick a reason with its number.");
  else b = bar(`<button class="btn danger" data-act="reject">Reject <kbd>r</kbd></button><button class="btn ok" data-act="approve">${ic("check")} Approve take <kbd>a</kbd></button>`, "<kbd>space</kbd> play · " + nextHint());
  return { main, ctx, bar: b };
}

        <div style="margin-top:10px;display:flex;gap:8px"><input class="field" placeholder="Add a spelling: type Arabic or an id" dir="auto"><button class="btn sm">Add</button></div>

    b = bar(`<button class="btn ghost" data-act="sub-back">Close <kbd>esc</kbd></button><button class="btn primary">Save family</button>`, "Spelling changes save at once; the details save with Save.");
  } else {
    const c = CONCEPTS[S.sub.slug];
    main = `<div class="hero"><div class="eyebrow"><span class="kindtag">${ic("shapes").replace("<svg", '<svg style="width:14px;height:14px"')} Concept</span><span class="mono">${c.slug}</span><span>The slug never changes.</span></div>

      <div class="card"><h4>Details</h4><div class="formgrid"><label>English name<input class="field" value="${esc(c.en)}"></label><label>Arabic name<input class="field" dir="rtl" lang="ar" value="${esc(c.ar)}" style="font-family:var(--ar-font);font-size:18px"></label>

      <select class="field" style="width:100%;margin-top:8px"><option>Link a word family...</option>${Object.values(FAMILIES).filter((f) => !c.families.includes(f.id)).map((f) => `<option>${f.gloss} (${f.id})</option>`).join("")}</select></div>`;
